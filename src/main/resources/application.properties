spring.application.name=CmsTechubApi
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:h2:mem:cms_techub}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASS:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

spring.thymeleaf.cache=false

server.servlet.session.timeout=30m
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never

jwt.secret=${JWT_SECRET:CmsTechubMarketplaceSecretKeyMustBeAtLeast32BytesLongForHS256!}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- HikariCP tuned for Neon free tier ---
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.connection-test-query=SELECT 1
